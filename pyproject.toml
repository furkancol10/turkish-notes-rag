[project]
name = "kisiselnotarama"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "pymupdf>=2.1",
    "pyside6>=6.12.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
